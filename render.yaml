services:
  - type: web
    name: wishverse
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
      - key: SECRET_KEY
        generateValue: true
      # This wires up Render's own managed Postgres (defined below) so you get
      # a persistent DB with zero manual setup. If you'd rather use Supabase
      # instead, delete this fromDatabase block, delete the "databases:"
      # section at the bottom, and replace it with:
      #   - key: DATABASE_URL
      #     sync: false # then paste your Supabase connection string in the dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: wishverse-db
          property: connectionString
      # Restrict this to your real frontend origin(s) once you have a domain,
      # e.g. '["https://wishverse.onrender.com"]'
      - key: BACKEND_CORS_ORIGINS
        value: "*"

databases:
  # ⚠️ plan: free means this Postgres database is DELETED 30 days after
  # creation (14-day grace period to upgrade first), with NO backups
  # available on the free tier. Fine for testing/demos, risky for real user
  # data. Before that matters:
  #   - Change "plan: free" to a paid plan (from ~$6-7/mo) to remove the
  #     expiry and enable backups, OR
  #   - Set up your own periodic backups, e.g. a scheduled job running:
  #       pg_dump "$DATABASE_URL" | gzip > backup-$(date +%F).sql.gz
  #     See DEPLOYMENT.md for a ready-to-use GitHub Actions example.
  - name: wishverse-db
    plan: free
    region: oregon
    postgresMajorVersion: 16
